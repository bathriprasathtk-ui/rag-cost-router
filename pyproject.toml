# --- Project metadata --------------------------------------------------------
# Vercel's Python builder (CLI >= 59) installs runtime dependencies with uv
# straight from this file: a pyproject.toml WITHOUT a [project] table makes
# `uv lock` fail the deploy with "No `project` table found".
# Keep this dependency list in sync with requirements.txt (kept for plain
# `pip install -r` workflows and CI).
[project]
name = "rag-cost-router"
version = "0.1.0"
description = "Semantic caching + cost-aware RAG router with a live cost/latency dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

# --- Tool configuration ------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root must be importable (`import app`) however pytest is invoked:
# `python -m pytest` prepends the cwd, bare `pytest` (what CI runs) does not.
pythonpath = ["."]
